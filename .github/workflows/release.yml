name: Release

# Publishes to Maven Central and creates a GitHub release when a version tag (vX.Y.Z) is pushed.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  publish:
    name: Publish to Maven Central
    # macOS can build every target, including the Apple ones.
    runs-on: macos-latest
    # The keys for Maven Central and for signing are secrets of this environment, and a maintainer
    # approves each run before the job starts. A pushed tag alone cannot publish.
    environment: release
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6

      - name: Check that the tag matches VERSION_NAME
        run: |
          version="$(grep '^VERSION_NAME=' gradle.properties | cut -d= -f2)"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match VERSION_NAME=$version in gradle.properties"
            exit 1
          fi

      # The macOS job of the CI workflow runs the same tasks on every pull request.
      - name: Check
        run: ./gradlew check apiCheck

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-release
          path: '**/build/reports/'

      - name: Publish
        run: ./gradlew publishAndReleaseToMavenCentral --no-configuration-cache
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_IN_MEMORY_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_IN_MEMORY_KEY_PASSWORD }}

      - name: Create GitHub release from the changelog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          # Take the changelog section for this version: from its heading up to the next version heading.
          awk -v v="$version" '/^## \[/ { found = ($0 ~ "^## \\[" v "\\]") ; next } found && !/^\[.*\]: / { print }' CHANGELOG.md > release-notes.md
          prerelease=""
          case "$version" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file release-notes.md $prerelease
